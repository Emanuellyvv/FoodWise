<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Criar conta | FoodWise</title>
  <meta name="description" content="Crie sua conta gratuita na FoodWise." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icones/icone-180.png" />
  <meta name="theme-color" content="#1E3309" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profissional.css" />
</head>
<body>

  <div id="layout-cabecalho"></div>

  <main>
    <section class="cabecalho-pagina">
      <div class="container">
        <div class="trilha"><a href="index.html">Início</a> / Criar conta</div>
        <h1>Crie sua conta na FoodWise</h1>
        <p>Leva menos de dois minutos.</p>
      </div>
    </section>

    <section class="secao-auth">
      <div class="container">
        <div class="cartao-auth largo">
          <h2>Bem-vindo(a)</h2>
          <p>Preencha os dados para começar.</p>

          <form id="form-cadastro" class="formulario-auth" novalidate>

            <!-- Avatar -->
            <div class="campo">
              <label>Escolha um avatar</label>
              <div class="seletor-avatar">
                <button type="button" class="opcao-avatar selecionado" data-avatar="🥑" aria-label="Avatar abacate">🥑</button>
                <button type="button" class="opcao-avatar" data-avatar="🍉" aria-label="Avatar melancia">🍉</button>
                <button type="button" class="opcao-avatar" data-avatar="🥦" aria-label="Avatar brócolis">🥦</button>
                <button type="button" class="opcao-avatar" data-avatar="🍓" aria-label="Avatar morango">🍓</button>
                <button type="button" class="opcao-avatar" data-avatar="🍋" aria-label="Avatar limão">🍋</button>
                <button type="button" class="opcao-avatar" data-avatar="🥕" aria-label="Avatar cenoura">🥕</button>
              </div>
            </div>

            <!-- Dados pessoais -->
            <div class="linha-formulario">
              <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name" required />
                <span class="mensagem-erro"></span>
              </div>
              <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000" autocomplete="tel" required />
                <span class="mensagem-erro"></span>
              </div>
            </div>

            <div class="linha-formulario">
              <div class="campo">
                <label for="email-cadastro">E-mail</label>
                <input type="email" id="email-cadastro" placeholder="seuemail@exemplo.com" autocomplete="email" required />
                <span class="mensagem-erro"></span>
              </div>
              <div class="campo">
                <label for="data-nascimento">Data de nascimento</label>
                <input type="date" id="data-nascimento" autocomplete="bday" required />
                <span class="mensagem-erro"></span>
              </div>
            </div>

            <div class="linha-formulario">
              <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha segura" autocomplete="new-password" required />
                <div class="forca-senha"><span></span><span></span><span></span><span></span></div>
                <span class="mensagem-erro"></span>
              </div>
              <div class="campo">
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita sua senha" autocomplete="new-password" required />
                <span class="mensagem-erro"></span>
              </div>
            </div>

            <!-- Preferências -->
            <div class="linha-formulario">
              <div class="campo">
                <label for="objetivo">Objetivo principal</label>
                <select id="objetivo" required>
                  <option value="">Selecione uma opção</option>
                  <option value="emagrecimento">Emagrecimento</option>
                  <option value="ganho-de-massa">Ganho de massa muscular</option>
                  <option value="alimentacao-equilibrada">Alimentação equilibrada</option>
                  <option value="performance">Performance esportiva</option>
                </select>
                <span class="mensagem-erro"></span>
              </div>
              <div class="campo">
                <label for="restricao">Restrição alimentar (opcional)</label>
                <select id="restricao">
                  <option value="nenhuma">Nenhuma</option>
                  <option value="vegetariano">Vegetariano</option>
                  <option value="vegano">Vegano</option>
                  <option value="sem-gluten">Sem glúten</option>
                  <option value="sem-lactose">Sem lactose</option>
                </select>
              </div>
            </div>

            <!-- Endereço -->
            <h3 class="subtitulo-formulario">Endereço de entrega (opcional)</h3>
            <div class="linha-formulario">
              <div class="campo">
                <label for="cep-cadastro">CEP</label>
                <input type="text" id="cep-cadastro" placeholder="00000-000" autocomplete="postal-code" />
              </div>
              <div class="campo">
                <label for="numero-cadastro">Número</label>
                <input type="text" id="numero-cadastro" placeholder="Nº" />
              </div>
            </div>
            <div class="campo">
              <label for="endereco-cadastro">Endereço</label>
              <input type="text" id="endereco-cadastro" placeholder="Rua, avenida..." />
            </div>
            <div class="linha-formulario">
              <div class="campo">
                <label for="bairro-cadastro">Bairro</label>
                <input type="text" id="bairro-cadastro" placeholder="Bairro" />
              </div>
              <div class="campo">
                <label for="cidade-cadastro">Cidade</label>
                <input type="text" id="cidade-cadastro" placeholder="Cidade" autocomplete="address-level2" />
              </div>
            </div>
            <div class="campo">
              <label for="complemento-cadastro">Complemento (opcional)</label>
              <input type="text" id="complemento-cadastro" placeholder="Apto, bloco, referência" />
            </div>

            <label class="campo-checkbox">
              <input type="checkbox" required />
              Concordo com os Termos de Uso e a Política de Privacidade
            </label>

            <button type="submit" class="botao botao-primario botao-bloco">Criar minha conta</button>
          </form>

          <p class="rodape-auth">Já tem uma conta? <a href="login.html">Entrar agora</a></p>
        </div>
      </div>
    </section>
  </main>

  <div id="layout-rodape"></div>
  <div id="layout-nav-mobile"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/entrega.js"></script>
  <script src="js/pagamento.js"></script>
</body>
</html>
