<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cardápio | FoodWise</title>
  <meta name="description" content="Cardápio da FoodWise com informações nutricionais completas." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1E3309" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profissional.css" />
</head>
<body>

  <!-- Cabeçalho: montado pelo js/layout.js -->
  <div id="layout-cabecalho"></div>

  <main>
    <section class="cabecalho-pagina">
      <div class="container">
        <div class="trilha"><a href="index.html">Início</a> / Cardápio</div>
        <h1>Nosso cardápio</h1>
        <p>Clique em um prato para ver a foto ampliada, as informações nutricionais e para qual objetivo ele é mais indicado.</p>
      </div>
    </section>

    <section class="secao">
      <div class="container">

        <div class="barra-filtros">
          <div class="filtros-categoria">
            <button class="filtro-tag ativo" data-categoria="todos">Todos</button>
            <button class="filtro-tag" data-categoria="fitness">Fitness</button>
            <button class="filtro-tag" data-categoria="fast-food">Fast Food</button>
            <button class="filtro-tag" data-categoria="saladas">Saladas</button>
            <button class="filtro-tag" data-categoria="pratos-quentes">Pratos quentes</button>
            <button class="filtro-tag" data-categoria="sobremesas">Sobremesas</button>
            <button class="filtro-tag" data-categoria="bebidas">Bebidas</button>
          </div>
          <div class="busca-cardapio">
            <span class="icone-busca">🔍</span>
            <input type="text" id="busca-prato" placeholder="Buscar prato..." aria-label="Buscar prato" />
          </div>
        </div>

        <p class="status-cardapio" id="status-cardapio">Carregando cardápio...</p>

        <!-- Os pratos são inseridos aqui pelo js/cardapio.js, a partir do GitHub -->
        <div class="grade-cardapio" id="grade-cardapio">
          <p class="mensagem-vazia">Carregando cardápio...</p>
        </div>

      </div>
    </section>
  </main>

  <!-- Carrinho flutuante -->
  <div class="carrinho-flutuante">🛒 Ver carrinho <span class="contador">0</span></div>

  <!-- Rodapé e menu inferior: montados pelo js/layout.js -->
  <div id="layout-rodape"></div>
  <div id="layout-nav-mobile"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/entrega.js"></script>
  <script src="js/pagamento.js"></script>
</body>
</html>
