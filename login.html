<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entrar | FoodWise</title>
  <meta name="description" content="Acesse sua conta FoodWise." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icones/icone-180.png" />
  <meta name="theme-color" content="#1E3309" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profissional.css" />
</head>
<body>

  <div id="layout-cabecalho"></div>

  <main>
    <section class="cabecalho-pagina">
      <div class="container">
        <div class="trilha"><a href="index.html">Início</a> / Entrar</div>
        <h1>Que bom te ver de novo</h1>
        <p>Acesse sua conta para continuar seu pedido.</p>
      </div>
    </section>

    <section class="secao-auth">
      <div class="container">
        <div class="cartao-auth">
          <h2>Entrar na conta</h2>
          <p>Informe seus dados de acesso.</p>

          <form id="form-login" class="formulario-auth" novalidate>
            <div class="campo">
              <label for="email-login">E-mail</label>
              <input type="email" id="email-login" placeholder="seuemail@exemplo.com" autocomplete="email" required />
              <span class="mensagem-erro"></span>
            </div>
            <div class="campo">
              <label for="senha-login">Senha</label>
              <input type="password" id="senha-login" placeholder="Digite sua senha" autocomplete="current-password" required />
              <span class="mensagem-erro"></span>
            </div>
            <div class="linha-opcoes">
              <span></span>
              <button type="button" id="botao-abrir-recuperacao" class="link-como-botao">Esqueci minha senha</button>
            </div>
            <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>
          </form>

          <div id="painel-recuperar-senha" class="painel-recuperar-senha">
            <p class="nota-recuperar-senha">Este projeto não tem servidor de e-mail: confirme o e-mail da conta e crie uma nova senha aqui mesmo.</p>
            <form id="form-recuperar-senha" class="formulario-auth" novalidate>
              <div class="campo">
                <label for="email-recuperar">E-mail da conta</label>
                <input type="email" id="email-recuperar" placeholder="seuemail@exemplo.com" required />
                <span class="mensagem-erro"></span>
              </div>
              <div class="campo">
                <label for="nova-senha">Nova senha</label>
                <input type="password" id="nova-senha" placeholder="Crie uma nova senha" autocomplete="new-password" required />
                <span class="mensagem-erro"></span>
              </div>
              <button type="submit" class="botao botao-secundario botao-bloco">Redefinir senha</button>
            </form>
          </div>

          <p class="rodape-auth">Ainda não tem conta? <a href="cadastro.html">Cadastre-se gratuitamente</a></p>
        </div>
      </div>
    </section>
  </main>

  <div id="layout-rodape"></div>
  <div id="layout-nav-mobile"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/entrega.js"></script>
  <script src="js/pagamento.js"></script>
</body>
</html>
